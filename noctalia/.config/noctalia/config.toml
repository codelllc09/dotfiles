[shell]
font_family = "Maple Mono NF CN"
setup_wizard_enabled = false
clipboard_enabled = true
polkit_agent = true
offline_mode = true

[theme]
sync_color_scheme = false

[wallpaper]
enabled = false

[weather]
enabled = false

[lockscreen]
enabled = true
lock_before_suspend = true

[notification]
enable_daemon = true

[bar.default]
thickness = 28
margin_ends = 0
padding = 8
start = ["workspaces", "taskbar", "active_window"]
center = ["clock"]
end = ["cpu", "ram", "input-mode", "privacy", "volume", "network", "stacked-speed", "battery", "notifications", "tray"]

[system.monitor]
cpu_poll_seconds = 5.0
memory_poll_seconds = 5.0
network_poll_seconds = 2.0

[widget.clock]
format = "%Y/%-m/%-d %a %T"

[widget.cpu]
stat = "cpu_usage"
visualization = "none"
show_glyph = false
custom_label = "CPU"

[widget.ram]
stat = "ram_pct"
visualization = "none"
show_glyph = false
custom_label = "RAM"

[widget.network]
show_label = false

[widget.network.actions]
middle = "exec /usr/bin/nm-connection-editor"

[widget.input-mode]
type = "lcw/panel-status:input"

[widget.stacked-speed]
type = "lcw/panel-status:network"

[widget.lock]
type = "custom_button"
glyph = "lock"
tooltip = "鎖屏"

[widget.lock.actions]
left = "exec /usr/bin/noctalia msg session lock"

[widget.tray]
drawer = true
hide_passive = false

[idle]
behavior_order = ["screensaver"]
pre_action_fade_seconds = 0.0

[idle.behavior.screensaver]
action = "command"
enabled = true
timeout = 600
command = '"$HOME/.local/bin/screensaver"'
resume_command = "pkill -f '^(/usr/bin/)?mpv .*--title=[s]aver( |$)' || true"

[widget.battery]
display_mode = "graphic"
show_label = true

[widget.active_window]
display = "text_only"

[plugins]
enabled = ["lcw/panel-status"]
