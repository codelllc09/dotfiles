# Fedora Wayland · WezTerm 常用操作
font_family      family='Maple Mono NF CN' style=Regular
bold_font        family='Maple Mono NF CN' style=Bold
italic_font      family='LXGW WenKai Mono' style=Regular
bold_italic_font family='LXGW WenKai Mono' style=Medium
font_size 12.0
window_padding_width 3 4.5
scrollback_lines 20000

foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
cursor_text_color #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
url_color #f5e0dc
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

tab_bar_style custom
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_bar_background #1e1e2e
active_tab_background #313244
active_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
inactive_tab_foreground #6c7086
active_tab_font_style normal
inactive_tab_font_style normal

enabled_layouts splits
startup_session default.kitty-session
tab_bar_filter session:~
wayland_enable_ime yes
watcher terminal_watcher.py

touch_scroll_multiplier 0.5
wheel_scroll_multiplier 2.5
momentum_scroll 0
pixel_scroll no
url_excluded_characters ()[]{}<>
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

map ctrl+shift+enter launch --cwd=current --location=vsplit --add-to-session=.
map ctrl+shift+e launch --cwd=current --location=hsplit --add-to-session=.
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window top
map ctrl+shift+down neighboring_window bottom
map ctrl+shift+w close_window_with_confirmation
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n launch --type=os-window --cwd=current --add-to-session=.
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map f8 kitten workflow_keys.py detach
map ctrl+shift+o kitten workflow_keys.py workspace
map ctrl+shift+i kitten workflow_keys.py compose
